<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>RONDA — Registro de vistorias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E2E6DE;
    --surface:#F7F6F1;
    --surface-2:#EEEBE1;
    --ink:#14161A;
    --ink-soft:#5B5E66;
    --ink-faint:#8A8D94;
    --line:#C9CCD3;
    --accent:#1737E3;
    --accent-ink:#FFFFFF;
    --ok:#2E6B4C;
    --ok-bg:#E1EEE6;
    --pending:#8C6A16;
    --pending-bg:#F1E8CE;
    --andamento:#5B6169;
    --andamento-bg:#E6E7E3;
    --alert:#AE3626;
    --alert-bg:#F5E2DE;
    --radius:2px;
    --shadow:0 1px 0 rgba(24,27,22,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Onest',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .disp{font-family:'Onest',sans-serif; font-weight:600;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  #app{max-width:1180px;margin:0 auto;padding:18px 16px 90px;}

  /* ---------- HERO BANNER ---------- */
  .heroBanner{
    position:relative;left:50%;right:50%;margin-left:-50vw;margin-right:-50vw;width:100vw;
    margin-top:-18px;margin-bottom:20px;
    background-size:cover;background-position:center;
    border-bottom:2px solid var(--ink);
  }
  .heroInner{
    max-width:1180px;margin:0 auto;padding:20px 16px 24px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .logoPill{
    background:#fff;padding:6px 12px;border-radius:4px;display:inline-flex;align-items:center;
    box-shadow:0 1px 4px rgba(0,0,0,.18);
  }
  .brandLogo{height:20px;width:auto;display:block;}
  @media(min-width:700px){.brandLogo{height:24px;}}
  .brand .mark{
    font-family:'Onest',sans-serif;font-weight:600;color:#fff;
    font-size:30px;letter-spacing:0.5px;line-height:1;
  }
  .brand .tag{color:rgba(255,255,255,.78);font-size:13px;}
  .headerActions{display:flex;gap:10px;align-items:center;}
  .heroBanner .liveDot{color:rgba(255,255,255,.85);}
  .heroBanner .btn.primary{background:#fff;color:var(--accent);border-color:#fff;}
  .heroBanner .btn.primary:hover{background:#EEF1FF;}
  .iconBtn{
    width:38px;height:38px;border-radius:var(--radius);
    border:1px solid var(--line);background:var(--surface);
    display:flex;align-items:center;justify-content:center;
    color:var(--ink);transition:transform .15s ease, background .15s ease;
  }
  .iconBtn:hover{background:var(--surface-2);}
  .liveDot{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);padding:0 4px;}
  .liveDot .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg);}
  .liveDot.off .dot{background:var(--alert);box-shadow:0 0 0 3px var(--alert-bg);}
  .iconBtn.spin svg{animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .btn{
    display:inline-flex;align-items:center;gap:7px;
    border-radius:var(--radius);border:1px solid var(--ink);
    padding:9px 16px;font-size:14.5px;font-weight:500;
    background:var(--ink);color:var(--surface);
  }
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .btn.ghost{background:transparent;color:var(--ink);}
  .btn.small{padding:6px 11px;font-size:13px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  /* ---------- TOOLBAR ---------- */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
  .searchWrap{
    flex:1 1 220px;display:flex;align-items:center;gap:8px;
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:8px 12px;
  }
  .searchWrap input{border:none;background:none;flex:1;font-size:14.5px;color:var(--ink);}
  .searchWrap input:focus{outline:none;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{
    border:1px solid var(--line);background:var(--surface);
    border-radius:20px;padding:6px 13px;font-size:13.5px;color:var(--ink-soft);
  }
  .chip.active{background:var(--ink);border-color:var(--ink);color:var(--surface);}

  /* ---------- GRID / CARDS ---------- */
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
    gap:14px;
  }
  .card{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);overflow:hidden;
    display:flex;flex-direction:column;text-align:left;
    box-shadow:var(--shadow);transition:border-color .15s ease;
  }
  .card:hover{border-color:var(--ink-faint);}
  .cardBtn{all:unset;cursor:pointer;display:block;width:100%;}
  .thumb{
    width:100%;aspect-ratio:16/10;background:var(--surface-2);
    object-fit:cover;display:block;border-bottom:1px solid var(--line);
  }
  .thumbPlaceholder{
    width:100%;aspect-ratio:16/10;background:var(--surface-2);
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--ink-faint);
  }
  .cardBody{padding:12px 13px 13px;flex:1;display:flex;flex-direction:column;gap:6px;}
  .cardTop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
  .badge{
    font-size:11.5px;font-weight:600;letter-spacing:.2px;
    padding:3px 8px;border-radius:20px;white-space:nowrap;
  }
  .badge.aberto{background:var(--pending-bg);color:var(--pending);}
  .badge.andamento{background:var(--andamento-bg);color:var(--andamento);}
  .badge.resolvido{background:var(--ok-bg);color:var(--ok);}
  .cat{font-size:12px;color:var(--ink-soft);}
  .loc{font-size:16.5px;font-weight:600;line-height:1.25;}
  .desc{font-size:13.5px;color:var(--ink-soft);line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .cardFoot{display:flex;justify-content:space-between;align-items:center;
    font-size:12px;color:var(--ink-faint);margin-top:4px;}
  .confirmTag{display:inline-flex;align-items:center;gap:4px;color:var(--alert);font-weight:600;}
  .resolvedCard{opacity:.62;}

  .empty{
    border:1px dashed var(--line);border-radius:var(--radius);
    padding:44px 20px;text-align:center;color:var(--ink-soft);
    background:var(--surface);
  }
  .empty .disp{font-size:22px;color:var(--ink);margin-bottom:6px;}

  /* ---------- OVERLAY / MODAL ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(20,22,18,.55);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;
    padding:0;
  }
  @media(min-width:700px){.overlay{align-items:center;padding:24px;}}
  .sheet{
    background:var(--bg);width:100%;max-width:620px;max-height:92vh;
    overflow-y:auto;border-radius:var(--radius);
    border-top:2px solid var(--ink);
  }
  @media(min-width:700px){.sheet{border:2px solid var(--ink);}}
  .sheetHead{
    position:sticky;top:0;background:var(--bg);z-index:2;
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 18px;border-bottom:1px solid var(--line);
  }
  .sheetHead h2{font-family:'Onest',sans-serif;font-weight:600;font-size:23px;margin:0;}
  .sheetBody{padding:18px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field input[type=text],.field textarea,.field select{
    width:100%;border:1px solid var(--line);border-radius:var(--radius);
    padding:10px 11px;font-size:15px;background:var(--surface);color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:80px;}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--ink);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:480px){.row2{grid-template-columns:1fr;}}

  /* duplicate warning */
  .dupBox{border:1px solid var(--alert);background:var(--alert-bg);border-radius:var(--radius);
    padding:12px 13px;margin-bottom:16px;}
  .dupBox .dupHead{display:flex;gap:8px;align-items:center;color:var(--alert);font-weight:600;font-size:14px;margin-bottom:8px;}
  .dupItem{display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:9px;margin-bottom:8px;}
  .dupItem img{width:56px;height:56px;object-fit:cover;border-radius:2px;flex-shrink:0;background:var(--surface-2);}
  .dupItem .dupInfo{flex:1;min-width:0;}
  .dupItem .dupInfo .loc{font-size:14px;}
  .dupItem .dupInfo .desc{-webkit-line-clamp:1;font-size:12.5px;}
  .dupActions{display:flex;gap:6px;margin-top:6px;}

  /* photo picker */
  .photoRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .photoThumb{position:relative;width:76px;height:76px;border-radius:2px;overflow:hidden;border:1px solid var(--line);}
  .photoThumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photoThumb .rm{position:absolute;top:2px;right:2px;background:rgba(20,20,20,.7);
    color:#fff;border:none;border-radius:50%;width:19px;height:19px;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .addPhotoBtn{
    width:76px;height:76px;border-radius:2px;border:1px dashed var(--ink-faint);
    background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;color:var(--ink-soft);font-size:11px;
  }

  /* detail modal */
  .gallery{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;}
  .gallery img{height:180px;border-radius:2px;flex-shrink:0;}
  .metaGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-bottom:16px;}
  .metaGrid .k{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.4px;}
  .metaGrid .v{font-size:14.5px;font-weight:500;}
  .divider{border:none;border-top:1px solid var(--line);margin:16px 0;}
  .confirmList{list-style:none;padding:0;margin:0;font-size:13.5px;color:var(--ink-soft);}
  .confirmList li{padding:5px 0;border-bottom:1px solid var(--line);}
  .actionRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}

  .banner{
    display:flex;gap:10px;align-items:center;justify-content:space-between;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:10px 13px;margin-bottom:16px;font-size:13.5px;flex-wrap:wrap;
  }
  .banner input{border:1px solid var(--line);border-radius:2px;padding:6px 9px;font-size:13.5px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--surface);padding:10px 18px;
    border-radius:20px;font-size:13.5px;z-index:80;opacity:0;transition:opacity .2s ease;
    pointer-events:none;
  }
  .toast.show{opacity:1;}

  .fab{
    position:fixed;right:18px;bottom:18px;z-index:40;
    background:var(--accent);color:var(--accent-ink);border:none;
    border-radius:30px;padding:14px 20px;display:flex;align-items:center;gap:8px;
    font-weight:600;font-size:14.5px;box-shadow:0 3px 10px rgba(0,0,0,.22);
  }
  @media(min-width:700px){.fab{display:none;}}
  .desktopNew{display:none;}
  @media(min-width:700px){.desktopNew{display:inline-flex;}}

  .loadingWrap{padding:60px 0;text-align:center;color:var(--ink-soft);}
</style>
</head>

/* ---------------- UTILS ---------------- */
function normalize(str){
  return (str||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
}
function tokens(str){ const n = normalize(str); return n ? new Set(n.split(" ")) : new Set(); }
function jaccard(a,b){
  if(a.size===0 && b.size===0) return 0;
  let inter=0; a.forEach(t=>{ if(b.has(t)) inter++; });
  const union = a.size + b.size - inter;
  return union===0 ? 0 : inter/union;
}
function escapeHtml(s){
  return (s||"").toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}) + " " + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){ return iso; }
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
let toastTimer=null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2400);
}

function findDuplicates(list, predioId, andar, salaCodigo, salaManual, categoria, excludeId){
  if(!predioId || !andar) return [];
  const manualTok = salaCodigo ? null : tokens(salaManual);
  if(!salaCodigo && (!manualTok || manualTok.size===0)) return [];
  return list
    .filter(t => t.status !== 'resolvido' && t.id !== excludeId)
    .filter(t => t.predioId === predioId && t.andar === andar)
    .filter(t => {
      if(salaCodigo) return t.salaCodigo === salaCodigo;
      return jaccard(manualTok, tokens(t.salaManual || t.salaNome)) >= 0.5;
    })
    .filter(t => t.categoria === categoria)
    .slice(0,3);
}

/* ---------------- IMAGE HANDLING ---------------- */
function resizeImage(file, maxWidth, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('img'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('read'));
    reader.readAsDataURL(file);
  });
}

          ${t.status==='aberto' ? `<button class="btn" data-setstatus="andamento">Marcar em andamento</button><button class="btn" data-setstatus="resolvido">Marcar resolvido</button>` : ""}
          ${t.status==='andamento' ? `<button class="btn" data-setstatus="resolvido">Marcar resolvido</button><button class="btn ghost" data-setstatus="aberto">Reabrir</button>` : ""}
          ${t.status==='resolvido' ? `<button class="btn ghost" data-setstatus="aberto">Reabrir</button>` : ""}
        </div>
        <div class="actionRow">
          <button class="btn ghost" id="btnCopyFields">${ICON.copy} Copiar campos</button>
          <button class="btn ghost" id="btnDownloadTicket">${ICON.download} Baixar arquivo</button>
        </div>
      </div>
    </div>
  </div>`;
}

/* ---------------- FIELD TEXT / EXPORT ---------------- */
function ticketFieldsText(t){
  return [
    "PRÉDIO: " + t.predioNome,
    "ANDAR: " + t.andar,
    "SALA: " + ticketLocLabel(t),
    "CATEGORIA: " + t.categoria,
    "DESCRIÇÃO: " + t.descricao,
    "RELATADO POR: " + t.reporter,
    "DATA: " + fmtDate(t.createdAt),
    "STATUS: " + STATUS_LABEL[t.status],
    "CONFIRMAÇÕES: " + ((t.confirmations||[]).length) + " pessoa(s) relataram o mesmo problema"
  ].join("\n");
}
function downloadText(filename, text){
  const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function csvEscape(v){
  const s = (v===undefined||v===null) ? "" : String(v);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function exportAllCsv(){
  const header = ["ID","Predio","Andar","Codigo Sala","Sala","Categoria","Descricao","Status","Relatado por","Data","Confirmacoes"];
  const rows = state.list.map(t => [t.id, t.predioNome, t.andar, t.salaCodigo||"", t.salaCodigo?t.salaNome:t.salaManual, t.categoria, t.descricao, STATUS_LABEL[t.status], t.reporter, fmtDate(t.createdAt), (t.confirmations||[]).length]);
  const csv = [header, ...rows].map(r => r.map(csvEscape).join(",")).join("\n");
  downloadText("chamados-export.csv", csv);
}

/* ---------------- ACTIONS (Firestore, tempo real) ---------------- */
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), ms))
  ]);
}

function startRealtimeSync(){
  if(TEST_MODE){
    const cb = (list) => { state.list = list; state.loading = false; state.connError = false; render(); };
    testListeners.push(cb);
    testNotify();
    return;
  }
  const q = query(chamadosCol, orderBy("createdAt", "desc"));
  onSnapshot(q, snapshot => {
    state.list = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    state.loading = false;
    state.connError = false;
    render();
  }, err => {
    console.error(err);
    state.loading = false;
    state.connError = true;
    render();
    toast("Não foi possível conectar ao Firebase. Confira o firebaseConfig e as regras do Firestore.");
  });
  // Se depois de 10s ainda não chegou nenhuma resposta (nem dado, nem erro), avisa.
  setTimeout(() => {
    if(state.loading){
      state.loading = false;
      state.connError = true;
      render();
      toast("O Firebase não respondeu. Confira o firebaseConfig, se o Firestore foi criado e se as regras foram publicadas.");
    }
  }, 10000);
}

function openDetail(id){
  state.detailId = id;
  render();
}

async function setStatus(id, status){
  if(TEST_MODE){
    const list = testGetAll();
    const t = list.find(x=>x.id===id);
    if(t){ t.status = status; t.updatedAt = new Date().toISOString(); testSaveAll(list); testNotify(); }
    toast("Status atualizado para \"" + STATUS_LABEL[status] + "\"");
    return;
  }
  try{
    await withTimeout(updateDoc(doc(db, "chamados", id), { status, updatedAt: new Date().toISOString() }), 15000);
    toast("Status atualizado para \"" + STATUS_LABEL[status] + "\"");
  }catch(e){
    console.error(e);
    toast(e.message==="timeout" ? "O Firebase demorou demais para responder. Confira sua conexão." : "Não foi possível atualizar o status agora.");
  }
}

async function addConfirmation(id){
  if(!state.reporterName){
    const name = prompt("Seu nome, para registrar a confirmação:");
    if(!name) return;
    state.reporterName = name.trim();
    saveReporterName(state.reporterName);
  }
  if(TEST_MODE){
    const list = testGetAll();
    const t = list.find(x=>x.id===id);
    if(t){
      t.confirmations = t.confirmations || [];
      t.confirmations.push({ name: state.reporterName, date: new Date().toISOString() });
      testSaveAll(list); testNotify();
    }
    toast("Confirmado. Isso ajuda a priorizar o atendimento.");
    return;
  }
  try{
    await withTimeout(updateDoc(doc(db, "chamados", id), {
      confirmations: arrayUnion({ name: state.reporterName, date: new Date().toISOString() })
    }), 15000);
    toast("Confirmado. Isso ajuda a priorizar o atendimento.");
  }catch(e){
    console.error(e);
    toast(e.message==="timeout" ? "O Firebase demorou demais para responder. Confira sua conexão." : "Não foi possível confirmar agora.");
  }
}

async function submitNewTicket(){
  const f = state.newForm;
  const categoria = document.getElementById('fCategoria').value;
  const descricao = document.getElementById('fDescricao').value.trim();

  if(!f.predioId || !f.andar){
    toast("Selecione o prédio e o andar.");
    return;
  }
  if(!f.isManual && !f.salaCodigo){
    toast("Selecione a sala, ou escolha \"Outro\" para digitar o local.");
    return;
  }
  const salaManualVal = f.isManual ? document.getElementById('fSalaManual').value.trim() : "";
  if(f.isManual && !salaManualVal){
    toast("Descreva o local, já que a sala não está na lista.");
    return;
  }
  if(!descricao){
    toast("Descreva o problema encontrado.");
    return;
  }
  if(!state.reporterName){
    const nameInput = document.getElementById('fReporterName');
    const name = nameInput ? nameInput.value.trim() : "";
    if(!name){ toast("Informe seu nome para continuar."); return; }
    state.reporterName = name;
    saveReporterName(name);
  }
  state.saving = true;
  render();

  const predio = getPredio(f.predioId);
  const now = new Date().toISOString();
  const ticket = {
    predioId: f.predioId,
    predioNome: predioLabel(predio),
    andar: f.andar,
    salaCodigo: f.isManual ? null : f.salaCodigo,
    salaNome: f.isManual ? null : f.salaNome,
    salaManual: f.isManual ? salaManualVal : null,
    categoria, descricao,
    status:"aberto",
    reporter: state.reporterName,
    createdAt: now, updatedAt: now,
    thumb: f.photos[0] ? f.photos[0].thumb : null,
    photos: f.photos.map(p=>p.full),
    confirmations: []
  };

  try{
    if(TEST_MODE){
      const list = testGetAll();
      list.push({ id: uid(), ...ticket });
      testSaveAll(list);
      testNotify();
    }else{
      await withTimeout(addDoc(chamadosCol, ticket), 20000);
    }
    state.showNewModal = false;
    state.newForm = {predioId:"", andar:"", salaCodigo:"", salaNome:"", salaManual:"", isManual:false, categoria:CATEGORIAS[0], descricao:"", photos:[]};
    toast("Chamado registrado.");
  }catch(e){
    console.error(e);
    toast(e.message==="timeout"
      ? "O Firebase demorou demais para responder. Confira o firebaseConfig, se o Firestore foi criado e sua conexão."
      : "Não foi possível registrar o chamado. Confira sua conexão e as regras do Firestore.");
  }
  state.saving = false;
  render();
}

/* ---------------- EVENT BINDING ---------------- */
function bindEvents(){
  const $ = sel => document.getElementById(sel);

  const searchInput = $('searchInput');
  if(searchInput){
    searchInput.oninput = e => { state.search = e.target.value; render(); document.getElementById('searchInput').focus(); document.getElementById('searchInput').selectionStart = document.getElementById('searchInput').value.length; };
  }

  document.querySelectorAll('[data-filter]').forEach(el=>{
    el.onclick = () => { state.filter = el.getAttribute('data-filter'); render(); };
  });

  document.querySelectorAll('[data-open]').forEach(el=>{
    el.onclick = () => openDetail(el.getAttribute('data-open'));
  });

  const newMobile = $('btnNewMobile');
  if(newMobile) newMobile.onclick = () => { state.showNewModal = true; render(); };
  const newDesktop = $('btnNewDesktop');
  if(newDesktop) newDesktop.onclick = () => { state.showNewModal = true; render(); };

  const closeNew = $('btnCloseNew'); if(closeNew) closeNew.onclick = closeNewModal;
  const cancelNew = $('btnCancelNew'); if(cancelNew) cancelNew.onclick = closeNewModal;
  const overlayNew = $('newOverlay');
  if(overlayNew) overlayNew.addEventListener('mousedown', e => { if(e.target===overlayNew) closeNewModal(); });

  const fPredio = $('fPredio');
  if(fPredio) fPredio.onchange = e => {
    state.newForm.predioId = e.target.value;
    state.newForm.andar = "";
    state.newForm.salaCodigo = "";
    state.newForm.salaNome = "";
    state.newForm.salaManual = "";
    state.newForm.isManual = false;
    render();
  };
  const fAndar = $('fAndar');
  if(fAndar) fAndar.onchange = e => {
    state.newForm.andar = e.target.value;
    state.newForm.salaCodigo = "";
    state.newForm.salaNome = "";
    state.newForm.salaManual = "";
    state.newForm.isManual = false;
    render();
  };
  const fSala = $('fSala');
  if(fSala) fSala.onchange = e => {
    const val = e.target.value;
    if(val === SALA_OUTRO){
      state.newForm.isManual = true;
      state.newForm.salaCodigo = "";
      state.newForm.salaNome = "";
    }else{
      const andarObj = getAndar(state.newForm.predioId, state.newForm.andar);
      const sala = andarObj ? andarObj.salas.find(s=>s.codigo===val) : null;
      state.newForm.isManual = false;
      state.newForm.salaCodigo = val;
      state.newForm.salaNome = sala ? sala.nome : "";
    }
    render();
  };
  const fSalaManual = $('fSalaManual');
  if(fSalaManual){
    fSalaManual.oninput = debounce(e => {
      state.newForm.salaManual = e.target.value;
      const dupWrap = $('dupWrap');
      if(dupWrap) renderDuplicatesInto(dupWrap);
    }, 300);
  }
  const fCategoria = $('fCategoria');
  if(fCategoria) fCategoria.onchange = e => {
    state.newForm.categoria = e.target.value;
    const dupWrap = $('dupWrap');
    if(dupWrap) renderDuplicatesInto(dupWrap);
  };
  const fDescricao = $('fDescricao');
  if(fDescricao) fDescricao.oninput = e => { state.newForm.descricao = e.target.value; };

  const photoInput = $('photoInput');
  if(photoInput) photoInput.onchange = async e => {
    const file = e.target.files[0];
    if(!file) return;
    try{
      const [thumb, full] = await Promise.all([
        resizeImage(file, 160, 0.5),
        resizeImage(file, 640, 0.55)
      ]);
      state.newForm.photos.push({thumb, full});
      render();
    }catch(err){ toast("Não foi possível carregar essa foto."); }
  };
  document.querySelectorAll('[data-rmphoto]').forEach(el=>{
    el.onclick = () => {
      const i = parseInt(el.getAttribute('data-rmphoto'),10);
      state.newForm.photos.splice(i,1);
      render();
    };
  });

  document.querySelectorAll('[data-confirmdup]').forEach(el=>{
    el.onclick = async () => {
      const id = el.getAttribute('data-confirmdup');
      await addConfirmation(id);
      closeNewModal();
    };
  });

  const submitBtn = $('btnSubmitTicket');
  if(submitBtn) submitBtn.onclick = submitNewTicket;

  const closeDetail = $('btnCloseDetail'); if(closeDetail) closeDetail.onclick = closeDetailModal;
  const overlayDetail = $('detailOverlay');
  if(overlayDetail) overlayDetail.addEventListener('mousedown', e => { if(e.target===overlayDetail) closeDetailModal(); });

  document.querySelectorAll('[data-setstatus]').forEach(el=>{
    el.onclick = () => setStatus(state.detailId, el.getAttribute('data-setstatus'));
  });
  const addConfirmBtn = $('btnAddConfirm');
  if(addConfirmBtn) addConfirmBtn.onclick = () => addConfirmation(state.detailId);

  const copyBtn = $('btnCopyFields');
  if(copyBtn) copyBtn.onclick = () => {
    const t = state.list.find(x=>x.id===state.detailId);
    if(!t) return;
    const text = ticketFieldsText(t);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>toast("Campos copiados. Cole no sistema da empresa.")).catch(()=>toast("Não foi possível copiar automaticamente."));
    }
  };
  const dlBtn = $('btnDownloadTicket');
  if(dlBtn) dlBtn.onclick = () => {
    const t = state.list.find(x=>x.id===state.detailId);
    if(!t) return;
    downloadText("chamado-" + t.id + ".txt", ticketFieldsText(t));
  };
}

function closeNewModal(){
  state.showNewModal = false;
  state.newForm = {predioId:"", andar:"", salaCodigo:"", salaNome:"", salaManual:"", isManual:false, categoria:CATEGORIAS[0], descricao:"", photos:[]};
  state.duplicates = [];
  render();
}
function closeDetailModal(){
  state.detailId = null;
  render();
}

function debounce(fn, ms){
  let t;
  return function(...args){ clearTimeout(t); t = setTimeout(()=>fn.apply(this,args), ms); };
}

/* ---------------- INIT ---------------- */
function init(){
  state.reporterName = getReporterName();
  render();
  startRealtimeSync();
}
init();
</script>
