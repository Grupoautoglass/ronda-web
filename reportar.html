<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1737E3">
<title>RONDA — Reportar problema</title>
<link rel="manifest" href="reportar.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E2E6DE; --surface:#F7F6F1; --surface-2:#EEEBE1;
    --ink:#14161A; --ink-soft:#5B5E66; --ink-faint:#8A8D94; --line:#C9CCD3;
    --accent:#1737E3; --ok:#2E6B4C; --ok-bg:#E1EEE6; --alert:#AE3626; --alert-bg:#F5E2DE;
    --pending:#8C6A16; --pending-bg:#F1E8CE;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Onest',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom,0px);}
  #app{max-width:520px;margin:0 auto;padding:0 16px 60px;}
  .banner{background:var(--accent);color:#fff;margin:0 -16px 18px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;border-bottom:2px solid var(--ink);}
  .banner .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .logoPill{background:#fff;padding:6px 12px;border-radius:4px;display:inline-flex;align-items:center;}
  .logoPill img{height:20px;width:auto;display:block;}
  .banner .mark{font-weight:600;font-size:26px;letter-spacing:.5px;line-height:1;}
  .banner .sub{font-size:13px;color:rgba(255,255,255,.85);margin-top:8px;}
  h2{font-size:17px;margin:0 0 4px;font-weight:600;text-transform:uppercase;}
  p.hint{font-size:13px;color:var(--ink-soft);line-height:1.5;margin:0 0 14px;}
  .locBox{background:var(--ok-bg);border:1px solid var(--ok);border-radius:2px;padding:12px 14px;margin-bottom:18px;}
  .locBox .k{font-size:11px;color:var(--ok);text-transform:uppercase;letter-spacing:.4px;font-weight:600;}
  .locBox .v{font-size:18px;color:var(--ok);font-weight:700;text-transform:uppercase;}
  .locBox .b{font-size:13px;color:var(--ok);}
  .locBox a{font-size:12.5px;color:var(--accent);cursor:pointer;text-decoration:underline;display:inline-block;margin-top:6px;}
  .field{margin-bottom:15px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field input[type=text],.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:2px;padding:10px 11px;font-size:15px;background:var(--surface);color:var(--ink);font-family:inherit;}
  .field textarea{min-height:84px;resize:vertical;}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--ink);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:420px){.row2{grid-template-columns:1fr;}}
  .photoRow{display:flex;gap:8px;flex-wrap:wrap;}
  .photoThumb{position:relative;width:74px;height:74px;border-radius:2px;overflow:hidden;border:1px solid var(--line);}
  .photoThumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photoThumb button{position:absolute;top:2px;right:2px;width:19px;height:19px;border-radius:50%;border:none;background:rgba(20,20,20,.7);color:#fff;font-size:12px;line-height:1;cursor:pointer;}
  .addPhoto{width:74px;height:74px;border-radius:2px;border:1px dashed var(--ink-faint);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--ink-soft);cursor:pointer;gap:2px;}
  .addPhoto b{font-size:22px;font-weight:400;}
  .field label.addPhoto{display:flex;margin-bottom:0;font-size:11px;font-weight:400;color:var(--ink-soft);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;width:100%;border-radius:2px;border:1px solid var(--accent);padding:12px 18px;font-size:15.5px;font-weight:600;background:var(--accent);color:#fff;cursor:pointer;font-family:inherit;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink);}
  .note{border:1px solid var(--line);background:var(--surface);border-radius:2px;padding:10px 12px;font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;line-height:1.45;}
  .note.warn{background:var(--pending-bg);border-color:#C7A93B;color:#7A5E0E;}
  .note.err{background:var(--alert-bg);border-color:var(--alert);color:var(--alert);}
  .done{background:var(--ok-bg);border:2px solid var(--ok);border-radius:2px;padding:20px 16px;text-align:center;margin-bottom:16px;}
  .done .big{font-size:20px;font-weight:700;color:var(--ok);margin-bottom:6px;}
  .done p{margin:0;font-size:14px;color:var(--ink);line-height:1.5;}
  .err-inline{color:var(--alert);font-size:13px;margin:-6px 0 12px;}
</style>
</head>

function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function findSala(code){
  const q = (code||"").trim().toLowerCase();
  if(!q) return null;
  for(const p of PREDIOS) for(const a of p.andares) for(const s of a.salas){
    if(s.codigo.toLowerCase() === q) return { predioId:p.id, andar:a.nome, salaCodigo:s.codigo, salaNome:s.nome };
  }
  return null;
}
function resizeImage(file, maxWidth, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('img'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('read'));
    reader.readAsDataURL(file);
  });
}
function withTimeout(promise, ms, value){
  return Promise.race([promise, new Promise(res => setTimeout(() => res(value), ms))]);
}

/* ---------- estado ---------- */
const params = new URLSearchParams(location.search);
const fromQr = findSala(params.get("sala"));
const state = {
  loc: fromQr ? { ...fromQr, isManual:false, salaManual:"" } : { predioId:"", andar:"", salaCodigo:"", salaManual:"", isManual:false },
  qrOk: !!fromQr,
  qrCode: params.get("sala") || "",
  nome: lsGet("ronda-colab-nome"),
  pilar: lsGet("ronda-colab-pilar"),
  categoria: CATEGORIAS[0], outroResumo:"", patrimonio:"", descricao:"",
  photos: [],
  sending:false, error:"", done:null, pending:false, authFailed:false
};

/* login anônimo (invisível para o colaborador) */
onAuthStateChanged(auth, user => {
  if(!user){
    signInAnonymously(auth).catch(() => { state.authFailed = true; render(); });
  }else{
    state.authFailed = false;
  }
});
/* chamados guardados no celular e ainda não enviados */
withTimeout(waitForPendingWrites(db).then(()=>false), 1500, true).then(p => { state.pending = p; render(); });
waitForPendingWrites(db).then(() => { if(state.pending){ state.pending = false; render(); } });

/* ---------- tela ---------- */
function banner(){
  return `<div class="banner"><div class="row"><span class="logoPill"><img src="${LOGO_SRC}" alt="Quality · Grupo Autoglass"></span><span class="mark">RONDA</span></div><div class="sub">Reportar um problema no ambiente</div></div>`;
}

function render(){
  const app = document.getElementById('app');
  if(state.done){ app.innerHTML = banner() + renderDone(); bindDone(); return; }
  app.innerHTML = banner() + renderForm();
  bindForm();
}

function renderDone(){
  const q = state.done === 'queued';
  return `<div class="done">
      <div class="big">${q ? "Guardado no celular" : "Enviado, obrigado!"}</div>
      <p>${q
        ? "Você está sem internet agora. O chamado ficou salvo e será enviado quando a conexão voltar. Para isso, <b>abra esta página de novo com internet</b> (pode ser pelo mesmo QR code). Não limpe os dados do navegador antes disso."
        : "A equipe já recebeu o seu relato."}</p>
    </div>
    <button class="btn" id="btnAgain">Reportar outro problema</button>`;
}
function bindDone(){
  document.getElementById('btnAgain').onclick = () => {
    state.done = null; state.photos = []; state.descricao = ""; state.outroResumo = ""; state.patrimonio = "";
    state.categoria = CATEGORIAS[0]; state.error = "";
    render();
  };
}

function locBlock(){
  if(state.qrOk){
    const p = getPredio(state.loc.predioId);
    return `<div class="locBox">
      <div class="k">Você está reportando em</div>
      <div class="v">${escapeHtml(state.loc.salaCodigo)} · ${escapeHtml(state.loc.salaNome)}</div>
      <div class="b">${escapeHtml(p ? predioLabel(p) : "")} · ${escapeHtml(state.loc.andar)}</div>
      <a id="lnkTrocar">Não é essa sala? Escolher outro local</a>
    </div>`;
  }
  const f = state.loc;
  const predio = f.predioId ? getPredio(f.predioId) : null;
  const andarObj = predio && f.andar ? getAndar(f.predioId, f.andar) : null;
  return `
    ${state.qrCode && !state.qrOk ? `<div class="note warn">Não reconheci o código "${escapeHtml(state.qrCode)}". Escolha o local abaixo.</div>` : ""}
    <div class="field"><label for="fPredio">Prédio</label>
      <select id="fPredio"><option value="" ${!f.predioId?'selected':''} disabled>Selecione o prédio</option>
        ${PREDIOS.map(p=>`<option value="${p.id}" ${p.id===f.predioId?'selected':''}>${escapeHtml(predioLabel(p))}</option>`).join("")}
      </select></div>
    <div class="row2">
      <div class="field"><label for="fAndar">Andar</label>
        <select id="fAndar" ${!predio?'disabled':''}><option value="" ${!f.andar?'selected':''} disabled>${predio?'Selecione':'Escolha o prédio'}</option>
          ${predio ? predio.andares.map(a=>`<option value="${escapeHtml(a.nome)}" ${a.nome===f.andar?'selected':''}>${escapeHtml(a.nome)}</option>`).join("") : ""}
        </select></div>
      <div class="field"><label for="fSala">Sala</label>
        <select id="fSala" ${!andarObj?'disabled':''}><option value="" ${!f.salaCodigo && !f.isManual?'selected':''} disabled>${andarObj?'Selecione':'Escolha o andar'}</option>
          ${andarObj ? andarObj.salas.map(s=>`<option value="${escapeHtml(s.codigo)}" ${s.codigo===f.salaCodigo?'selected':''}>${escapeHtml(s.codigo)} · ${escapeHtml(s.nome)}</option>`).join("") : ""}
          ${andarObj ? `<option value="${SALA_OUTRO}" ${f.isManual?'selected':''}>Outro (não está na lista)</option>` : ""}
        </select></div>
    </div>
    ${f.isManual ? `<div class="field"><label for="fSalaManual">Descreva o local</label><input type="text" id="fSalaManual" placeholder="Ex.: Corredor perto da recepção" value="${escapeHtml(f.salaManual||'')}"></div>` : ""}`;
}

function renderForm(){
  const mob = state.categoria === 'Mobiliário';
  return `
    ${state.pending ? `<div class="note warn">Há um chamado guardado neste celular aguardando internet. Ele será enviado assim que a conexão voltar, com esta página aberta.</div>` : ""}
    ${state.authFailed ? `<div class="note err">Não consegui preparar o envio. Se for o seu primeiro acesso, abra esta página uma vez com internet.</div>` : ""}
    ${locBlock()}
    <div class="field"><label for="fNome">Seu nome completo (ou nome de login)</label>
      <input type="text" id="fNome" placeholder="Ex.: Maria da Silva" maxlength="80" value="${escapeHtml(state.nome)}"></div>
    <div class="field"><label for="fPilar">Seu pilar</label>
      <select id="fPilar"><option value="" ${!state.pilar?'selected':''} disabled>Selecione</option>
        ${PILARES.map(p=>`<option value="${p}" ${p===state.pilar?'selected':''}>${p}</option>`).join("")}
      </select></div>
    <div class="field"><label for="fCategoria">Categoria do problema</label>
      <select id="fCategoria">${CATEGORIAS.map(c=>`<option value="${escapeHtml(c)}" ${c===state.categoria?'selected':''}>${c}</option>`).join("")}</select></div>
    ${state.categoria==='Outro' ? `<div class="field"><label for="fOutro">Tipo do problema (resumo curto)</label><input type="text" id="fOutro" placeholder="Ex.: Vazamento, Pichação" maxlength="40" value="${escapeHtml(state.outroResumo)}"></div>` : ""}
    <div class="field"><label for="fPatrimonio">Patrimônio ${mob ? '(obrigatório)' : '(se tiver)'}</label>
      <input type="text" id="fPatrimonio" placeholder="Número do patrimônio, se souber" maxlength="40" value="${escapeHtml(state.patrimonio)}"></div>
    <div class="field"><label for="fDescricao">Descreva o problema</label>
      <textarea id="fDescricao" maxlength="800" placeholder="O que você viu?">${escapeHtml(state.descricao)}</textarea></div>
    <div class="field"><label>Fotos (até 3)</label><div class="photoRow">
      ${state.photos.map((p,i)=>`<div class="photoThumb"><img src="${p.thumb}" alt=""><button data-rm="${i}" type="button">×</button></div>`).join("")}
      ${state.photos.length<3 ? `<label class="addPhoto"><b>+</b><span>Foto</span><input type="file" accept="image/*" capture="environment" id="fFoto" style="display:none"></label>` : ""}
    </div></div>
    ${state.error ? `<div class="err-inline">${escapeHtml(state.error)}</div>` : ""}
    <button class="btn" id="btnSend" ${state.sending?'disabled':''}>${state.sending?'Enviando…':'Enviar'}</button>`;
}

function syncFields(){
  const g = id => document.getElementById(id);
  if(g('fNome')) state.nome = g('fNome').value;
  if(g('fPilar')) state.pilar = g('fPilar').value;
  if(g('fOutro')) state.outroResumo = g('fOutro').value;
  if(g('fPatrimonio')) state.patrimonio = g('fPatrimonio').value;
  if(g('fDescricao')) state.descricao = g('fDescricao').value;
  if(g('fSalaManual')) state.loc.salaManual = g('fSalaManual').value;
}

function bindForm(){
  const g = id => document.getElementById(id);
  const trocar = g('lnkTrocar');
  if(trocar) trocar.onclick = () => { syncFields(); state.qrOk = false; state.loc = { predioId:"", andar:"", salaCodigo:"", salaManual:"", isManual:false }; render(); };
  if(g('fPredio')) g('fPredio').onchange = e => { syncFields(); state.loc = { predioId:e.target.value, andar:"", salaCodigo:"", salaManual:"", isManual:false }; render(); };
  if(g('fAndar')) g('fAndar').onchange = e => { syncFields(); state.loc.andar = e.target.value; state.loc.salaCodigo = ""; state.loc.isManual = false; render(); };
  if(g('fSala')) g('fSala').onchange = e => {
    syncFields();
    if(e.target.value === SALA_OUTRO){ state.loc.isManual = true; state.loc.salaCodigo = ""; state.loc.salaNome = ""; }
    else{
      const a = getAndar(state.loc.predioId, state.loc.andar);
      const s = a ? a.salas.find(x=>x.codigo===e.target.value) : null;
      state.loc.isManual = false; state.loc.salaCodigo = e.target.value; state.loc.salaNome = s ? s.nome : "";
    }
    render();
  };
  if(g('fCategoria')) g('fCategoria').onchange = e => { syncFields(); state.categoria = e.target.value; render(); };
  if(g('fFoto')) g('fFoto').onchange = async e => {
    const file = e.target.files[0]; if(!file) return;
    syncFields();
    try{
      const [thumb, full] = await Promise.all([resizeImage(file,160,0.5), resizeImage(file,640,0.55)]);
      state.photos.push({thumb, full}); render();
    }catch(err){ state.error = "Não consegui carregar essa foto."; render(); }
  };
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { syncFields(); state.photos.splice(parseInt(b.getAttribute('data-rm'),10),1); render(); });
  if(g('btnSend')) g('btnSend').onclick = send;
}

async function send(){
  syncFields();
  const f = state.loc;
  const nome = state.nome.trim();
  const descricao = capFirst(state.descricao.trim());
  const outro = capFirst(state.outroResumo.trim());
  const patrimonio = state.patrimonio.trim();
  const salaManual = capFirst((f.salaManual||"").trim());
  state.error = "";
  if(!f.predioId || !f.andar) state.error = "Selecione o prédio e o andar.";
  else if(!f.isManual && !f.salaCodigo) state.error = "Selecione a sala (ou \"Outro\").";
  else if(f.isManual && !salaManual) state.error = "Descreva o local.";
  else if(nome.length < 3) state.error = "Informe seu nome completo ou nome de login.";
  else if(!state.pilar) state.error = "Selecione o seu pilar.";
  else if(state.categoria==='Outro' && !outro) state.error = "Resuma o tipo do problema.";
  else if(state.categoria==='Mobiliário' && !patrimonio) state.error = "Para Mobiliário, informe o número do patrimônio.";
  else if(!descricao) state.error = "Descreva o problema.";
  if(state.error){ render(); return; }

  if(!auth.currentUser){
    try{ await withTimeout(signInAnonymously(auth), 5000, null); }catch(e){}
    if(!auth.currentUser){
      state.error = "Sem internet no primeiro acesso: abra esta página uma vez com internet e tente de novo.";
      render(); return;
    }
  }
  lsSet("ronda-colab-nome", nome); lsSet("ronda-colab-pilar", state.pilar);

  const predio = getPredio(f.predioId);
  const now = new Date().toISOString();
  const payload = {
    origem: 'qrcode', status: 'aberto',
    predioId: f.predioId, predioNome: predioLabel(predio), andar: f.andar,
    salaCodigo: f.isManual ? null : f.salaCodigo, salaNome: f.isManual ? null : (f.salaNome || null), salaManual: f.isManual ? salaManual : null,
    categoria: state.categoria, outroResumo: state.categoria==='Outro' ? outro : null,
    descricao, patrimonio: patrimonio || null,
    thumb: state.photos[0] ? state.photos[0].thumb : null,
    photos: state.photos.map(p => p.full),
    reporter: nome, reporterPilar: state.pilar, reporterUid: auth.currentUser.uid,
    createdAt: now, updatedAt: now,
    confirmations: [], osNumero: null, resolvidoEm: null
  };

  state.sending = true; render();
  const writePromise = addDoc(chamadosCol, payload);
  writePromise.catch(err => { console.error(err); });
  /* Com internet o envio confirma em instantes; sem internet o chamado fica guardado no celular. */
  const result = await Promise.race([
    writePromise.then(() => 'sent', () => 'error'),
    new Promise(res => setTimeout(() => res('queued'), 4000))
  ]);
  state.sending = false;
  if(result === 'error'){
    state.error = "Não foi possível enviar agora. Tente de novo em instantes.";
    render(); return;
  }
  state.done = result;
  render();
}

render();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
